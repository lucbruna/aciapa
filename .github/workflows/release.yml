name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create required dirs (not tracked by git)
        run: New-Item -ItemType Directory -Force -Path uploads, auth_info | Out-Null

      - name: Install deps
        run: npm ci --ignore-scripts
        env:
          npm_config_loglevel: warn
          npm_config_audit: false
          npm_config_fund: false

      - name: Rebuild native modules
        run: npx @electron/rebuild -f -w better-sqlite3,bcryptjs

      - name: Build frontend
        run: npm run build

      - name: Package
        run: npx electron-builder --win nsis --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: dist-electron
          path: dist-electron/

      - name: Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: |
            dist-electron/ACIAPA-Setup-*.exe
            dist-electron/latest.yml
            dist-electron/builder-debug.yml
          generate_release_notes: true
