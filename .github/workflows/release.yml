name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (skip broken install scripts)
        run: npm ci --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3 --only better-sqlite3

      - name: Build frontend
        run: npm run build

      - name: Package Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: cmd
        run: npx electron-builder --win nsis --x64

      - name: List dist-electron output
        if: success() || failure()
        run: Get-ChildItem dist-electron -Name

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: |
            dist-electron/ACIAPA-Setup-*.exe
            dist-electron/latest.yml
            dist-electron/builder-debug.yml
          generate_release_notes: true
