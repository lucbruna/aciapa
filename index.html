<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ACIAPA — Gestão Empresarial Inteligente</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23020408'/><path d='M8 16l2-6 6 4 6-8-2 6h4l-6 10-3-5z' fill='%236366f1'/></svg>"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;background:#020408}
      #splash{
        position:fixed;inset:0;z-index:9999;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:radial-gradient(ellipse at center,#0a1020 0%,#020408 70%);
        transition:opacity 0.5s ease;
      }
      #splash.out{opacity:0;pointer-events:none}
      .sp-glow{
        position:absolute;width:500px;height:500px;
        background:radial-gradient(circle,rgba(99,102,241,0.12) 0%,transparent 70%);
        border-radius:50%;pointer-events:none;
      }
      .sp-logo{
        width:72px;height:72px;border-radius:22px;
        background:linear-gradient(135deg,#6366f1,#8b5cf6);
        display:flex;align-items:center;justify-content:center;
        margin-bottom:22px;position:relative;z-index:1;
        box-shadow:0 0 60px rgba(99,102,241,0.5),0 0 120px rgba(99,102,241,0.2);
        animation:logo-pulse 2.5s ease-in-out infinite;
      }
      .sp-logo svg{width:34px;height:34px}
      .sp-title{
        font-family:'DM Sans',sans-serif;font-size:30px;font-weight:800;
        color:#f1f5f9;letter-spacing:-0.8px;position:relative;z-index:1;
      }
      .sp-title span{
        background:linear-gradient(135deg,#6366f1,#a78bfa);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      }
      .sp-sub{
        font-family:'DM Sans',sans-serif;font-size:11px;color:#334155;
        letter-spacing:4px;text-transform:uppercase;margin-top:8px;position:relative;z-index:1;
      }
      .sp-features{
        display:flex;gap:8px;margin-top:24px;position:relative;z-index:1;
      }
      .sp-feat{
        font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;
        color:#6366f1;background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.25);
        padding:5px 12px;border-radius:20px;opacity:0;
        animation:feat-in 0.4s ease forwards;
      }
      .sp-feat:nth-child(1){animation-delay:0.2s}
      .sp-feat:nth-child(2){animation-delay:0.4s}
      .sp-feat:nth-child(3){animation-delay:0.6s}
      .sp-feat:nth-child(4){animation-delay:0.8s}
      .sp-feat:nth-child(5){animation-delay:1.0s}
      .sp-bar{width:200px;height:2px;background:rgba(255,255,255,0.05);border-radius:2px;margin-top:32px;overflow:hidden;position:relative;z-index:1}
      .sp-fill{height:100%;background:linear-gradient(90deg,#4f46e5,#6366f1,#818cf8);border-radius:2px;animation:bar-anim 1.4s cubic-bezier(0.4,0,0.2,1) forwards}
      .sp-login{font-family:'DM Sans',sans-serif;font-size:10px;color:#1e293b;margin-top:20px;position:relative;z-index:1}
      @keyframes logo-pulse{0%,100%{box-shadow:0 0 60px rgba(99,102,241,0.5),0 0 120px rgba(99,102,241,0.2)}50%{box-shadow:0 0 80px rgba(99,102,241,0.7),0 0 160px rgba(99,102,241,0.35)}}
      @keyframes bar-anim{from{width:0}to{width:100%}}
      @keyframes feat-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="sp-glow"></div>
      <div class="sp-logo">
        <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 18l3-9 8 5 8-11-3 8h6L17 28l-4-7z" fill="white" stroke="white" stroke-width="0.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="sp-title">ACIAPA</div>
      <div class="sp-sub">Gestão Empresarial Inteligente</div>
      <div class="sp-features">
        <div class="sp-feat">IA Integrada</div>
        <div class="sp-feat">WhatsApp</div>
        <div class="sp-feat">CRM</div>
        <div class="sp-feat">Kanban</div>
        <div class="sp-feat">Relatórios</div>
      </div>
      <div class="sp-bar"><div class="sp-fill"></div></div>
      <div class="sp-login">admin@aciapa.com · nexus123</div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load',()=>{
        setTimeout(()=>{
          const s=document.getElementById('splash');
          if(s){s.classList.add('out');setTimeout(()=>s.remove(),500);}
        },1600);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
